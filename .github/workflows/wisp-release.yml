name: Wisp Release

on:
  push:
    tags: ["v*-wisp.*"]

concurrency:
  group: wisp-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build numbers are the commit count.
          fetch-depth: 0

      # vX.Y.Z-wisp.N builds as X.Y.Z+wisp.N, once build.zig.zon is at X.Y.Z.
      - name: Version
        id: version
        run: |
          version=$(python3 dist/wisp/release_version.py "$GITHUB_REF_NAME" build.zig.zon)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: ./.github/actions/wisp-macos
        with:
          version-string: ${{ steps.version.outputs.version }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}

      # The stable feed is the latest release's appcast.xml.
      - name: Update appcast
        env:
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          gh release download -p appcast.xml -O appcast-old.xml || true
          python3 dist/wisp/update_appcast.py \
            --channel stable \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$(git rev-parse --short HEAD)" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Wisp.dmg" \
            --signature sign_update.txt \
            --appcast appcast-old.xml \
            --out appcast.xml

      - name: Publish
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" Wisp.dmg appcast.xml \
            --verify-tag --latest \
            --title "Wisp $VERSION" \
            --notes "Wisp $VERSION, built from $GITHUB_SHA."

      # Writes Casks/wisp.rb in callistobound/homebrew-tap. TAP_DEPLOY_KEY is a
      # deploy key with write access to that repo only.
      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::TAP_DEPLOY_KEY isn't set; skipping the Homebrew cask"
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:callistobound/homebrew-tap.git tap
          python3 dist/wisp/cask.py stable "${GITHUB_REF_NAME#v}" \
            "$(shasum -a 256 Wisp.dmg | awk '{print $1}')" > tap/Casks/wisp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wisp.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "wisp ${GITHUB_REF_NAME#v}"
            git push
          fi
